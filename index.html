<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoahTube</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #1a0f08;
    background-image: url('https://raw.githubusercontent.com/noahgeoalta/noahtube/main/Background.jpg');
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
    color: #e8d9c0;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(8, 4, 2, 0.6);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    padding: 20px 16px 40px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 18px 0 18px;
  }
  .logo-wrap img {
    filter: drop-shadow(0 2px 14px rgba(0,0,0,0.9));
    object-fit: contain;
  }
  .logo-sc { height: 36px; }
  .logo-wc { height: 72px; }
  .logo-d2 { height: 52px; }

  .playlist-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (min-width: 600px) {
    .playlist-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
  }
  @media (min-width: 900px) {
    .playlist-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .playlist-card {
    cursor: pointer;
    position: relative;
    background: rgba(14, 9, 4, 0.85);
    border: 1px solid rgba(120, 80, 30, 0.3);
    border-radius: 3px;
    overflow: hidden;
    animation: fadeIn 0.3s ease both;
    backdrop-filter: blur(3px);
    transition: border-color 0.2s;
  }
  .playlist-card:nth-child(1) { animation-delay: 0.03s; }
  .playlist-card:nth-child(2) { animation-delay: 0.06s; }
  .playlist-card:nth-child(3) { animation-delay: 0.09s; }
  .playlist-card:nth-child(4) { animation-delay: 0.12s; }
  .playlist-card:nth-child(5) { animation-delay: 0.15s; }
  .playlist-card:nth-child(6) { animation-delay: 0.18s; }
  .playlist-card:nth-child(7) { animation-delay: 0.21s; }
  .playlist-card:nth-child(8) { animation-delay: 0.24s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .playlist-card:hover { border-color: rgba(200, 140, 40, 0.55); }
  .playlist-card:active { opacity: 0.75; }

  .card-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    position: relative;
    background: #1a1008;
  }
  .card-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .playlist-card:hover .card-thumb img { transform: scale(1.04); }

  .card-count {
    position: absolute;
    bottom: 6px; right: 7px;
    background: rgba(0,0,0,0.75);
    color: #bbb;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .resume-dot {
    position: absolute;
    top: 7px; left: 7px;
    width: 8px; height: 8px;
    background: #e05a00;
    border-radius: 50%;
    box-shadow: 0 0 6px #e05a00;
  }

  .card-body { padding: 8px 10px 10px; }
  .card-title {
    font-size: 13px;
    font-weight: 400;
    color: #e8d9c0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub { font-size: 11px; color: #6a5030; margin-top: 2px; }

  .loading {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px;
    font-size: 12px;
    color: #a08050;
    letter-spacing: 0.1em;
  }

  #player-screen { display: none; animation: fadeIn 0.2s ease; }

  .player-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 0 12px;
  }

  .back-btn {
    background: rgba(14,9,4,0.85);
    border: 1px solid rgba(120,80,30,0.4);
    color: #a08050;
    cursor: pointer;
    font-size: 18px;
    padding: 5px 14px;
    border-radius: 3px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .back-btn:hover { color: #e8d9c0; border-color: rgba(200,140,40,0.6); }

  .player-title {
    font-size: 13px;
    color: #907050;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-wrap {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  #yt-player { position: absolute; inset: 0; width: 100%; height: 100%; }

  .vl-header {
    display: flex;
    align-items: center;
    padding: 14px 0 8px;
    border-bottom: 1px solid rgba(120,80,30,0.2);
    margin-bottom: 2px;
  }
  .vl-label { font-size: 11px; color: #5a4020; letter-spacing: 0.08em; flex: 1; }
  .vl-count { font-size: 11px; color: #5a4020; }

  .video-list {
    overflow-y: auto;
    max-height: calc(100vh - 56.25vw - 120px);
    min-height: 180px;
  }

  .video-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: opacity 0.15s;
  }
  .video-item:hover { opacity: 0.7; }

  .vi-num { font-size: 11px; color: #5a4020; min-width: 18px; padding-top: 3px; text-align: right; }
  .video-item.active .vi-num { color: #e8d9c0; }

  .vi-thumb {
    width: 88px; min-width: 88px;
    aspect-ratio: 16/9;
    background: #1a1008;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .vi-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .vi-progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: #e05a00;
  }

  .vi-info { flex: 1; overflow: hidden; padding-top: 1px; }
  .vi-title {
    font-size: 12px;
    color: #907060;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .video-item.active .vi-title { color: #e8d9c0; }
  .vi-watched { font-size: 10px; color: #5a4020; margin-top: 3px; }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a2810; border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <div id="playlist-screen">
    <div class="logo-wrap">
      <img class="logo-sc" src="https://raw.githubusercontent.com/noahgeoalta/noahtube/main/StarCraft_Logo.jpg" alt="StarCraft">
      <img class="logo-wc" src="https://raw.githubusercontent.com/noahgeoalta/noahtube/main/warcraft.jpg" alt="WarCraft">
      <img class="logo-d2" src="https://raw.githubusercontent.com/noahgeoalta/noahtube/main/Diablo_2.jpg" alt="Diablo">
    </div>
    <div class="playlist-grid" id="playlist-grid">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div id="player-screen">
    <div class="player-header">
      <button class="back-btn" onclick="goBack()">&#8592;</button>
      <div class="player-title" id="player-title"></div>
    </div>
    <div class="player-wrap">
      <div id="yt-player"></div>
    </div>
    <div class="vl-header">
      <div class="vl-label">UP NEXT</div>
      <div class="vl-count" id="vl-count"></div>
    </div>
    <div class="video-list" id="video-list"></div>
  </div>

</div>
<script>
const API_KEY = 'AIzaSyBZN1fX8QCV1zRQNkANXK2rhOgdnS9mIuk';
const PLAYLISTS = [
  { id: 'PLQLYASJYnD3SbbkJXfLHlEiCDtVClnQO3', name: 'WarCraft III' },
  { id: 'PLQLYASJYnD3Rn7nN-A8fO-x6RrYwUcGnF', name: 'World of Warcraft' },
  { id: 'PLQLYASJYnD3T-MrNTRFisyoLN3Bgk-sXe', name: 'StarCraft' },
  { id: 'PLQLYASJYnD3SKhk3dk91biYoLtI857xhG', name: 'DOTA' },
  { id: 'PLQLYASJYnD3QBmKC_qDeN3iWd05lcXeFh', name: 'Diablo I & II' },
  { id: 'PLQLYASJYnD3RdUMxUqIS2XdRpvEU5Nppy', name: 'Elder Scrolls Books' },
  { id: 'PLQLYASJYnD3TSKLynNvJaVxCpDwbBSMgq', name: 'World of Warcraft OST' },
  { id: 'PLQLYASJYnD3RIXOqOow_gT9Pp0Kt4C9ty', name: 'Warhammer' },
];

let ytPlayer = null, currentVideos = [], currentIndex = 0, currentPlaylistId = null, saveTimer = null, videoDurations = {};

function getWatchData(plId) {
  try { return JSON.parse(localStorage.getItem('nt_' + plId)) || {}; } catch(e) { return {}; }
}
function saveProgress(plId, idx, vidId, time) {
  try {
    const all = getWatchData(plId);
    all.currentIdx = idx;
    all.videos = all.videos || {};
    if (vidId && time > 5) all.videos[vidId] = { time, updated: Date.now() };
    localStorage.setItem('nt_' + plId, JSON.stringify(all));
  } catch(e) {}
}
function getVideoProgress(plId, vidId) {
  return getWatchData(plId).videos?.[vidId] || null;
}
function formatTime(s) {
  if (!s) return '';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

window.onYouTubeIframeAPIReady = function() {};
(function() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();

async function fetchPlaylistInfo(id) {
  const r = await fetch('https://www.googleapis.com/youtube/v3/playlists?part=snippet,contentDetails&id='+id+'&key='+API_KEY);
  const d = await r.json();
  return d.items?.[0] || null;
}
async function fetchPlaylistItems(id) {
  let items = [], pageToken = '';
  do {
    const r = await fetch('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId='+id+'&key='+API_KEY+(pageToken?'&pageToken='+pageToken:''));
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    items = items.concat(d.items || []);
    pageToken = d.nextPageToken || '';
  } while(pageToken);
  return items;
}

async function renderPlaylists() {
  const grid = document.getElementById('playlist-grid');
  grid.innerHTML = '<div class="loading">Loading...</div>';
  const cards = await Promise.all(PLAYLISTS.map(async pl => {
    try {
      const info = await fetchPlaylistInfo(pl.id);
      const thumbs = info?.snippet?.thumbnails;
      const thumb = thumbs?.maxres?.url || thumbs?.standard?.url || thumbs?.high?.url || thumbs?.medium?.url || '';
      const count = info?.contentDetails?.itemCount || '?';
      const wd = getWatchData(pl.id);
      const hasProgress = (wd.currentIdx > 0) || Object.keys(wd.videos||{}).length > 0;
      return { pl, thumb, count, hasProgress, currentIdx: wd.currentIdx||0 };
    } catch(e) { return { pl, thumb:'', count:'?', hasProgress:false, currentIdx:0 }; }
  }));
  grid.innerHTML = cards.map(({pl,thumb,count,hasProgress,currentIdx}) =>
    '<div class="playlist-card" onclick="openPlaylist(\''+pl.id+'\',\''+pl.name.replace(/'/g,"\\'")+'\')">' +
    '<div class="card-thumb">' +
    (thumb ? '<img src="'+thumb+'" alt="" loading="lazy">' : '') +
    '<div class="card-count"><svg width="11" height="9" viewBox="0 0 11 9" fill="none"><rect y="0" width="11" height="1.5" fill="currentColor"/><rect y="3.5" width="8" height="1.5" fill="currentColor"/><rect y="7" width="9" height="1.5" fill="currentColor"/></svg>'+count+'</div>' +
    (hasProgress ? '<div class="resume-dot"></div>' : '') +
    '</div><div class="card-body"><div class="card-title">'+pl.name+'</div>' +
    '<div class="card-sub">'+(hasProgress ? 'Resume · #'+(currentIdx+1) : '')+'</div></div></div>'
  ).join('');
}

async function openPlaylist(plId, name) {
  currentPlaylistId = plId;
  document.getElementById('playlist-screen').style.display = 'none';
  document.getElementById('player-screen').style.display = 'block';
  document.getElementById('player-title').textContent = name;
  document.getElementById('video-list').innerHTML = '<div style="padding:30px;text-align:center;font-size:12px;color:#5a4020;">Loading...</div>';
  try {
    const items = await fetchPlaylistItems(plId);
    currentVideos = items.filter(it => it.snippet?.resourceId?.videoId && it.snippet.title !== 'Private video' && it.snippet.title !== 'Deleted video');
    const wd = getWatchData(plId);
    currentIndex = wd.currentIdx ? Math.min(wd.currentIdx, currentVideos.length-1) : 0;
    document.getElementById('vl-count').textContent = currentVideos.length;
    renderVideoList();
    const vidId = currentVideos[currentIndex]?.snippet?.resourceId?.videoId;
    const vp = vidId ? getVideoProgress(plId, vidId) : null;
    playVideo(currentIndex, vp?.time || 0);
  } catch(e) {
    document.getElementById('video-list').innerHTML = '<div style="padding:30px;text-align:center;font-size:12px;color:#884444;">Failed: '+e.message+'</div>';
  }
}

function renderVideoList() {
  const plId = currentPlaylistId;
  document.getElementById('video-list').innerHTML = currentVideos.map((v,i) => {
    const s = v.snippet;
    const thumb = s?.thumbnails?.default?.url || '';
    const vidId = s?.resourceId?.videoId;
    const vp = vidId ? getVideoProgress(plId, vidId) : null;
    const dur = vidId ? videoDurations[vidId] : null;
    const pct = (vp && dur) ? Math.min(100, (vp.time/dur)*100) : 0;
    const timeStr = vp ? formatTime(vp.time) : '';
    return '<div class="video-item '+(i===currentIndex?'active':'')+'" id="vi-'+i+'" onclick="playVideo('+i+',0)">' +
      '<div class="vi-num">'+(i+1)+'</div>' +
      '<div class="vi-thumb">'+(thumb?'<img src="'+thumb+'" loading="lazy">':'')+(pct>1?'<div class="vi-progress" style="width:'+pct+'%"></div>':'')+'</div>' +
      '<div class="vi-info"><div class="vi-title">'+(s?.title||'')+'</div>'+(timeStr?'<div class="vi-watched">watched to '+timeStr+'</div>':'')+'</div>' +
      '</div>';
  }).join('');
  setTimeout(() => document.getElementById('vi-'+currentIndex)?.scrollIntoView({block:'nearest'}), 100);
}

function updateActive(idx) {
  document.querySelectorAll('.video-item').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.getElementById('vi-'+idx)?.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function playVideo(idx, startTime) {
  currentIndex = idx;
  updateActive(idx);
  const videoId = currentVideos[idx]?.snippet?.resourceId?.videoId;
  if (!videoId) return;
  if (!startTime) {
    const vp = getVideoProgress(currentPlaylistId, videoId);
    if (vp) startTime = vp.time;
  }
  if (ytPlayer && ytPlayer.loadVideoById) {
    ytPlayer.loadVideoById({videoId, startSeconds: startTime||0});
  } else if (window.YT && window.YT.Player) {
    try { if (ytPlayer) ytPlayer.destroy(); } catch(e) {}
    ytPlayer = new YT.Player('yt-player', {
      videoId,
      playerVars: { autoplay:1, start:Math.floor(startTime||0), rel:0, modestbranding:1, playsinline:1 },
      events: {
        onStateChange: function(e) { if (e.data===0 && currentIndex < currentVideos.length-1) playVideo(currentIndex+1, 0); },
        onReady: function(e) {
          e.target.playVideo();
          const dur = e.target.getDuration();
          if (dur) videoDurations[videoId] = dur;
        }
      }
    });
  } else { setTimeout(function() { playVideo(idx, startTime); }, 500); }
  startSaveTimer();
}

function startSaveTimer() {
  if (saveTimer) clearInterval(saveTimer);
  saveTimer = setInterval(function() {
    try {
      const time = ytPlayer && ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : null;
      const dur = ytPlayer && ytPlayer.getDuration ? ytPlayer.getDuration() : null;
      const videoId = currentVideos[currentIndex]?.snippet?.resourceId?.videoId;
      if (time && time > 5) {
        if (dur) videoDurations[videoId] = dur;
        saveProgress(currentPlaylistId, currentIndex, videoId, time);
        const vi = document.getElementById('vi-'+currentIndex);
        if (vi && dur) {
          let bar = vi.querySelector('.vi-progress');
          if (!bar) { bar = document.createElement('div'); bar.className='vi-progress'; vi.querySelector('.vi-thumb').appendChild(bar); }
          bar.style.width = Math.min(100,(time/dur)*100)+'%';
          let w = vi.querySelector('.vi-watched');
          if (!w) { w = document.createElement('div'); w.className='vi-watched'; vi.querySelector('.vi-info').appendChild(w); }
          w.textContent = 'watched to '+formatTime(time);
        }
      }
    } catch(e) {}
  }, 5000);
}

function goBack() {
  if (saveTimer) clearInterval(saveTimer);
  try { if (ytPlayer) ytPlayer.pauseVideo(); } catch(e) {}
  document.getElementById('player-screen').style.display = 'none';
  document.getElementById('playlist-screen').style.display = 'block';
  renderPlaylists();
}

renderPlaylists();
</script>
</body>
</html>
